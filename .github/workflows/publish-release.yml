---
name: Publish Release
permissions:
  contents: write

concurrency:
  group: publish

on:
  push:
    tags:
      - "v*"
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # Pinned checkout keeps source retrieval reproducible while using the latest stable fixes.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/lib/android
        df -h
    - name: Set up Go
      # Pinned Go setup uses the latest stable runtime and cache fixes safely.
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
    - name: Import GPG key
      id: import_gpg
      # Pinned GPG import includes current security updates and preserves release signing inputs.
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      with:
        gpg_private_key: ${{ secrets.GCORE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
        passphrase: ${{ secrets.GCORE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
    - name: Run GoReleaser
      # Pinned GoReleaser execution keeps published artifacts reproducible with current fixes.
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: "~> v2.15.2"
        args: release --clean
      env:
        GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
