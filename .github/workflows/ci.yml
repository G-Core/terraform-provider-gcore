name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/G-Core/gcore-go,github.com/G-Core/gcore-go-staging

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-repo-read-token: ${{ secrets.GO_REPO_READ_TOKEN }}

      # GCLOUD2-24419: link co-generated go SDK — gcore-go-staging@<branch> → @main → pinned release (staging-only).
      - name: Link staging branch
        if: github.repository == 'G-Core/terraform-provider-gcore-staging'
        env:
          GH_REF: ${{ github.ref_name }}
        run: |
          for ref in "$GH_REF" main; do
            if go list -m "github.com/G-Core/gcore-go-staging@$ref" >/dev/null 2>&1; then
              echo "Linking to gcore-go-staging@$ref"
              ./scripts/link "github.com/G-Core/gcore-go-staging@$ref"
              exit 0
            fi
          done
          echo "No linkable gcore-go-staging branch (@$GH_REF or @main); building against pinned release."

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          go-repo-read-token: ${{ secrets.GO_REPO_READ_TOKEN }}

      # GCLOUD2-24419: link co-generated go SDK — gcore-go-staging@<branch> → @main → pinned release (staging-only).
      - name: Link staging branch
        if: github.repository == 'G-Core/terraform-provider-gcore-staging'
        env:
          GH_REF: ${{ github.ref_name }}
        run: |
          for ref in "$GH_REF" main; do
            if go list -m "github.com/G-Core/gcore-go-staging@$ref" >/dev/null 2>&1; then
              echo "Linking to gcore-go-staging@$ref"
              ./scripts/link "github.com/G-Core/gcore-go-staging@$ref"
              exit 0
            fi
          done
          echo "No linkable gcore-go-staging branch (@$GH_REF or @main); building against pinned release."

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test