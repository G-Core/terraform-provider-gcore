name: CI
on:
  # Keep push on `main` only. A branch push and its pull request share one head
  # SHA, so triggering on both produces two check runs with the same job name.
  # GitHub does not wait for both, which lets a required check pass unverified.
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  # stlc-config dispatches this for preview branches, which never get a pull
  # request here, so a preview SHA still gets exactly one run
  workflow_dispatch: {}

env:
  GOPRIVATE: github.com/G-Core/gcore-go,github.com/G-Core/gcore-go-staging

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'
    steps:
      # Pinned checkout keeps source retrieval reproducible while using the latest stable fixes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork pull requests receive no secrets, so skip the token there and let
      # the link step fall back to the pinned public release.
      - name: Generate gcore-sdk-bot read token
        if: github.repository == 'G-Core/terraform-provider-gcore-staging' && !github.event.pull_request.head.repo.fork
        id: app-token
        # Pinned app-token generation provides current security fixes without mutable tags.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GCORE_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GCORE_SDK_BOT_PRIVATE_KEY }}
          owner: G-Core
          repositories: gcore-go-staging
          permission-contents: read

      - uses: ./.github/actions/setup-go
        with:
          go-repo-read-token: ${{ steps.app-token.outputs.token }}

      # GCLOUD2-24419: link co-generated go SDK — gcore-go-staging@<branch> → @main → pinned release (staging-only).
      - name: Link staging branch
        if: github.repository == 'G-Core/terraform-provider-gcore-staging'
        env:
          # On a pull request `ref_name` is `<number>/merge`, which no SDK
          # branch matches, so prefer the head branch name.
          GH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          for ref in "$GH_REF" main; do
            if go list -m "github.com/G-Core/gcore-go-staging@$ref" >/dev/null 2>&1; then
              echo "Linking to gcore-go-staging@$ref"
              ./scripts/link "github.com/G-Core/gcore-go-staging@$ref"
              exit 0
            fi
          done
          echo "No linkable gcore-go-staging branch (@$GH_REF or @main); building against pinned release."

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'
    steps:
      # `go test ./...` links the whole provider into every test binary; the build cache alone is ~5 GB and
      # runs out of runner disk. Drop preinstalled toolchains the job never uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Pinned checkout keeps source retrieval reproducible while using the latest stable fixes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork pull requests receive no secrets, so skip the token there and let
      # the link step fall back to the pinned public release.
      - name: Generate gcore-sdk-bot read token
        if: github.repository == 'G-Core/terraform-provider-gcore-staging' && !github.event.pull_request.head.repo.fork
        id: app-token
        # Pinned app-token generation provides current security fixes without mutable tags.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GCORE_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GCORE_SDK_BOT_PRIVATE_KEY }}
          owner: G-Core
          repositories: gcore-go-staging
          permission-contents: read

      - uses: ./.github/actions/setup-go
        with:
          go-repo-read-token: ${{ steps.app-token.outputs.token }}

      # GCLOUD2-24419: link co-generated go SDK — gcore-go-staging@<branch> → @main → pinned release (staging-only).
      - name: Link staging branch
        if: github.repository == 'G-Core/terraform-provider-gcore-staging'
        env:
          # On a pull request `ref_name` is `<number>/merge`, which no SDK
          # branch matches, so prefer the head branch name.
          GH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          for ref in "$GH_REF" main; do
            if go list -m "github.com/G-Core/gcore-go-staging@$ref" >/dev/null 2>&1; then
              echo "Linking to gcore-go-staging@$ref"
              ./scripts/link "github.com/G-Core/gcore-go-staging@$ref"
              exit 0
            fi
          done
          echo "No linkable gcore-go-staging branch (@$GH_REF or @main); building against pinned release."

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
