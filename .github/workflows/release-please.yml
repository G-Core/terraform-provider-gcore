name: Release Please
on:
  push:
    branches:
      - v2

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'G-Core/terraform-provider-gcore'
    runs-on: ubuntu-latest

    steps:
      - name: Generate gcore-sdk-bot token
        id: app-token
        # Pinned app-token generation provides current security fixes without mutable tags.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GCORE_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GCORE_SDK_BOT_PRIVATE_KEY }}
          owner: G-Core
          repositories: terraform-provider-gcore
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Pinned release automation uses the latest stable Node 24-compatible action release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Generated code lives on the v2 branch (not the repo default branch
          # `master`); release-please-action defaults target-branch to the default
          # branch, so it must be set explicitly or it looks for config/manifest
          # on master and fails. Custom code — stlc's publish.release{branch: v2}
          # sets the `on:` trigger but not this input.
          target-branch: v2
